<!doctype html>
<html>
<head>
    <meta charset='utf-8'>
    <title>Cadastro de Cliente - Loja Online</title>
</head>
<body>
<h1>📝 Cadastro de Cliente</h1>

<p>Crie sua conta para começar a comprar!</p>

<hr>

<form action='cadastrarusuario' method='post'>
    <label>Nome Completo:</label><br>
    <input name='nome' required/><br><br>

    <label>Login (usuário):</label><br>
    <input name='login' required/><br><br>

    <label>Senha:</label><br>
    <input name='senha' type='password' required/><br><br>

    <button type='submit'>Cadastrar</button>
</form>

<hr>

</html>
